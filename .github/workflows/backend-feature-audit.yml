name: VYAJ backend feature audit

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/backend-feature-audit.yml"
      - "worker/index.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Audit implemented and placeholder backend actions
        run: |
          node <<'NODE'
          const base = 'https://vyaj-travel-api.kholymad.workers.dev/api/v1/actions/';
          const actions = [
            'signup',
            'login',
            'view-profile',
            'save-trip',
            'share-trip',
            'adjust-itinerary',
            'invite-travelers',
            'submit-vote',
            'view-notifications',
            'search-destinations',
            'decide-for-us',
            'surprise-me',
            'add-activity',
            'edit-itinerary',
            'book-trip',
            'open-settings'
          ];
          const results = await Promise.all(actions.map(async action => {
            try {
              const response = await fetch(base + action, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json', 'Origin': 'https://vyaj.eu' },
                body: JSON.stringify({ audit: true }),
                signal: AbortSignal.timeout(8000)
              });
              const body = await response.json().catch(() => ({}));
              const state = body.status === 'coming_soon' ? 'PLACEHOLDER' :
                body.status === 'available' ? 'AVAILABLE_RESPONSE' :
                !response.ok ? 'ERROR' : 'REVIEW_RESPONSE';
              return { action, http: response.status, state, feature: body.feature || null, message: body.message || body.error || null };
            } catch (e) {
              return { action, state: 'NETWORK_ERROR', message: e instanceof Error ? e.message : 'Request failed' };
            }
          }));
          console.log(JSON.stringify(results, null, 2));
          const placeholders = results.filter(r => r.state === 'PLACEHOLDER').length;
          const errors = results.filter(r => r.state === 'ERROR' || r.state === 'NETWORK_ERROR').length;
          console.log('SUMMARY: ' + placeholders + ' placeholder actions; ' + errors + ' errors.');
          NODE