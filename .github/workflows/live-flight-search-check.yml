name: VYAJ live flight search check

on:
  workflow_dispatch:
    inputs:
      origin:
        description: Origin IATA airport code
        required: true
        default: MLA
        type: string
      destination:
        description: Destination IATA airport code
        required: true
        default: CDG
        type: string
      departure_date:
        description: Future departure date (YYYY-MM-DD)
        required: true
        default: "2026-10-20"
        type: string
      trip_type:
        description: Trip type
        required: true
        default: oneway
        type: choice
        options:
          - oneway
          - roundtrip
      return_date:
        description: Return date for round trip (YYYY-MM-DD)
        required: false
        default: "2026-10-27"
        type: string
      adults:
        description: Number of adults
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - "6"
          - "7"
          - "8"
          - "9"

permissions:
  contents: read

jobs:
  check-live-flight-search:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call the live VYAJ flight search API
        env:
          ORIGIN: ${{ inputs.origin }}
          DESTINATION: ${{ inputs.destination }}
          DEPARTURE_DATE: ${{ inputs.departure_date }}
          TRIP_TYPE: ${{ inputs.trip_type }}
          RETURN_DATE: ${{ inputs.return_date }}
          ADULTS: ${{ inputs.adults }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const origin = process.env.ORIGIN.trim().toUpperCase();
          const destination = process.env.DESTINATION.trim().toUpperCase();
          const departureDate = process.env.DEPARTURE_DATE.trim();
          const tripType = process.env.TRIP_TYPE;
          const returnDate = process.env.RETURN_DATE.trim();
          const adults = Number(process.env.ADULTS);
          const datePattern = /^[0-9]{4}-[0-9]{2}-[0-9]{2}$/;
          if (!/^[A-Z]{3}$/.test(origin) || !/^[A-Z]{3}$/.test(destination) || origin === destination) throw new Error('Origin/destination must be different three-letter IATA codes.');
          if (!datePattern.test(departureDate) || Number.isNaN(Date.parse(departureDate + 'T00:00:00Z'))) throw new Error('Departure date must use YYYY-MM-DD.');
          if (!Number.isInteger(adults) || adults < 1 || adults > 9) throw new Error('Adults must be between 1 and 9.');
          if (tripType === 'roundtrip' && (!datePattern.test(returnDate) || returnDate < departureDate)) throw new Error('Round-trip return date must be valid and not before departure.');
          const payload = { origin, destination, departureDate, adults, currencyCode: 'EUR', travelClass: 'ECONOMY' };
          if (tripType === 'roundtrip') payload.returnDate = returnDate;
          const response = await fetch('https://vyaj-travel-api.kholymad.workers.dev/api/v1/actions/search-flights', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json', 'Origin': 'https://vyaj.eu' },
            body: JSON.stringify(payload),
            signal: AbortSignal.timeout(90000)
          });
          const body = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error('Live flight API returned HTTP ' + response.status + ': ' + (body.error || 'No error detail'));
          if (body.status !== 'available' || !Array.isArray(body.data) || body.data.length === 0) throw new Error('API responded but returned no usable flights: ' + JSON.stringify({status: body.status, error: body.error, provider: body.provider, count: body.data?.length || 0}));
          const flights = body.data;
          const bad = flights.filter(f => !f.price || !f.departure || !f.arrival || !/^https:\/\/www\.google\.com\/travel\/flights\?/.test(f.bookingUrl || ''));
          if (bad.length) throw new Error('Some returned flights have missing price/time or a Google Flights link: ' + bad.length);
          console.log(JSON.stringify({ result: 'PASS', route: origin + ' → ' + destination, departureDate, tripType, returnDate: tripType === 'roundtrip' ? returnDate : undefined, adults, count: flights.length, sample: flights.slice(0, 3).map(f => ({ airline: f.airline, price: f.price, currency: f.currency, departure: f.departure, arrival: f.arrival, stops: f.stops, bookingUrl: f.bookingUrl })) }, null, 2));
          NODE
