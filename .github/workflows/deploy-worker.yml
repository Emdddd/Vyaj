name: Deploy VYAJ Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'wrangler.toml'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Worker bundle
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.toml
      - name: Deploy Worker with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 386c29597c5b65dd1ce64cdf00e6051e
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'Missing GitHub Actions secret CLOUDFLARE_API_TOKEN.'
            exit 1
          fi
          npx --yes wrangler@4 deploy --config wrangler.toml
