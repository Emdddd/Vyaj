name: VYAJ live browser smoke test

on:
  workflow_run:
    workflows: ["Deploy VYAJ to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install project dependencies
        run: npm install
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test live desktop, mobile, waitlist modal and trip generation
        run: |
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          try {
            const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
            const response = await mobile.goto('https://vyaj.eu', { waitUntil: 'domcontentloaded', timeout: 45000 });
            assert(response && response.ok(), `Live site did not load successfully: ${response?.status()}`);
            // GitHub Pages deploys asynchronously after a push; wait for the new experience instead of testing stale HTML.
            for (let attempt = 0; attempt < 18; attempt++) {
              const discoveryReady = await mobile.locator('#discover').count() === 1
                && await mobile.locator('.v2-discovery-card[aria-pressed="false"]').count() === 3;
              if (discoveryReady) break;
              await mobile.waitForTimeout(5000);
              await mobile.reload({ waitUntil: 'domcontentloaded', timeout: 45000 });
            }
            await mobile.waitForTimeout(1200);
            assert((await mobile.title()).toLowerCase().includes('vyaj'), 'Page title does not identify VYAJ');
            assert(await mobile.locator('#destination-input').count() === 1, 'Trip builder destination field is missing');
            assert(await mobile.locator('#discover').count() === 1, 'Travel discovery section is missing');
            assert(await mobile.locator('.v2-hero h1').count() === 1, 'Hero headline element is missing');
            assert((await mobile.locator('.v2-hero h1').innerText()).trim().length > 0, 'Hero headline is empty');
            const languagePicker = mobile.locator('.v2-language-picker select');
            for (const [locale, expected] of [['ar', /اكتشف رحلة/], ['fr', /Trouvez le voyage/], ['it', /Trova il viaggio/], ['en', /Discover the trip/]]) {
              await languagePicker.selectOption(locale);
              await mobile.waitForFunction(expectedLocale => document.documentElement.lang === expectedLocale, locale);
              assert(await mobile.locator('main.v2-site').getAttribute('dir') === 'ltr', `Layout direction changed for ${locale}`);
              const headline = await mobile.locator('.v2-hero h1').innerText();
              assert(expected.test(headline), `Hero headline did not switch to ${locale}: ${headline}`);
            }
            await languagePicker.selectOption('en');
            assert(await mobile.locator('.v2-discovery-card').count() === 3, 'Expected three interactive discovery cards');
            assert(await mobile.locator('.v2-discovery-card[aria-pressed="false"]').count() === 3, 'Live site has not deployed the latest interactive discovery-card version');
            const mobileMetrics = await mobile.evaluate(() => ({
              viewport: window.innerWidth,
              page: document.documentElement.scrollWidth,
              height: document.documentElement.scrollHeight
            }));
            console.log('Mobile layout metrics:', JSON.stringify(mobileMetrics));
            assert(mobileMetrics.page <= mobileMetrics.viewport + 2, `Horizontal overflow on mobile: ${mobileMetrics.page}px page vs ${mobileMetrics.viewport}px viewport`);
            await mobile.screenshot({ path: 'artifacts/vyaj-mobile.png', fullPage: true });
            await mobile.locator('.v2-discovery-card').first().click();
            assert((await mobile.locator('#destination-input').inputValue()).includes('Puteaux'), 'Choosing the calm discovery card did not prefill Puteaux');
            assert(await mobile.locator('.v2-style-option.v2-selected').innerText() === 'Slow escape', 'Choosing the calm discovery card did not set the trip style');
            assert(await mobile.locator('.v2-discovery-card').first().getAttribute('aria-pressed') === 'true', 'Selected discovery card does not expose its selected state');
            // scrollIntoView uses smooth scrolling; wait for the animation to reach the builder before asserting viewport position.
            await mobile.waitForFunction(() => {
              const builder = document.getElementById('trip-builder');
              return !!builder && builder.getBoundingClientRect().top < window.innerHeight;
            }, { timeout: 10000 }).catch(() => {});
            assert(await mobile.locator('#trip-builder').evaluate(el => el.getBoundingClientRect().top < window.innerHeight), 'Clicking a discovery card did not bring the trip builder into view');
            await mobile.locator('.v2-discovery-card').nth(1).click();
            assert((await mobile.locator('#destination-input').inputValue()).includes('Valletta'), 'Choosing the Malta card did not prefill Valletta');
            assert(await mobile.locator('.v2-style-option.v2-selected').innerText() === 'Food & culture', 'Choosing the Malta card did not set the trip style');
            await mobile.locator('.v2-discovery-card').nth(2).click();
            assert((await mobile.locator('#destination-input').inputValue()).includes('Rome'), 'Choosing the Italy card did not prefill Rome');
            assert(await mobile.locator('.v2-style-option.v2-selected').innerText() === 'Food & culture', 'Choosing the culture card did not set the trip style');
            assert(await mobile.locator('.v2-discovery-card').nth(2).getAttribute('aria-pressed') === 'true', 'The newly selected card is not marked selected');
            console.log('Mobile discovery cards correctly prefill destination and travel style, scroll to the builder, and expose the selected state.');
            await mobile.close();

            const desktop = await browser.newPage({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 });
            const desktopResponse = await desktop.goto('https://vyaj.eu', { waitUntil: 'domcontentloaded', timeout: 45000 });
            assert(desktopResponse && desktopResponse.ok(), `Desktop page failed: ${desktopResponse?.status()}`);
            await desktop.waitForTimeout(1500);
            await desktop.screenshot({ path: 'artifacts/vyaj-desktop.png', fullPage: true });

            const waitlistButton = desktop.getByRole('button', { name: /get early access|join the waitlist/i }).last();
            await waitlistButton.click();
            await desktop.getByRole('dialog').waitFor({ state: 'visible', timeout: 5000 });
            await desktop.keyboard.press('Escape');
            await desktop.getByRole('dialog').waitFor({ state: 'hidden', timeout: 5000 });
            console.log('Waitlist modal opens and closes with Escape.');

            await desktop.locator('#destination-input').fill('Valletta, Malta');
            await desktop.locator('form.v2-builder-card select').first().selectOption('2');
            await desktop.getByRole('button', { name: /plan my trip/i }).click();
            await desktop.locator('.v2-trip-summary h3').waitFor({ state: 'visible', timeout: 65000 });
            const title = (await desktop.locator('.v2-trip-summary h3').innerText()).trim();
            const dayCount = await desktop.locator('.v2-day-card').count();
            assert(title.length > 0, 'AI itinerary title is empty');
            assert(dayCount > 0, 'AI itinerary contains no day cards');
            await desktop.screenshot({ path: 'artifacts/vyaj-itinerary.png', fullPage: true });
            console.log('Frontend-to-Worker trip generation succeeded:', JSON.stringify({ title, dayCount }));
            await desktop.close();
          } finally {
            await browser.close();
          }
          NODE
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vyaj-browser-smoke-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
